<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#0ea5e9" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Crystal Shimmer Gradient -->
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.75" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Filter for 3D Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0369a1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Icon Background Squircle (iOS / Android / Desktop compatible) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Internal Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.45" />

  <!-- Background Snowflakes and Sparkles -->
  <g opacity="0.3" fill="#ffffff">
    <circle cx="80" cy="110" r="6" />
    <circle cx="430" cy="90" r="8" />
    <circle cx="410" cy="420" r="5" />
    <circle cx="95" cy="400" r="7" />
    <circle cx="256" cy="70" r="4" />
  </g>

  <!-- Ice Castle Silhouette Base -->
  <g filter="url(#softShadow)">
    <!-- Castle Central Spire -->
    <polygon points="256,90 286,210 226,210" fill="url(#crystalGrad)" stroke="#ffffff" stroke-width="3" />
    <polygon points="256,70 262,95 250,95" fill="#facc15" />
    <rect x="236" y="210" width="40" height="150" fill="url(#crystalGrad)" stroke="#ffffff" stroke-width="3" rx="4" />

    <!-- Castle Left Spire -->
    <polygon points="175,150 198,240 152,240" fill="url(#crystalGrad)" stroke="#ffffff" stroke-width="2.5" />
    <rect x="157" y="240" width="36" height="120" fill="url(#crystalGrad)" stroke="#ffffff" stroke-width="2.5" rx="4" />

    <!-- Castle Right Spire -->
    <polygon points="337,150 360,240 314,240" fill="url(#crystalGrad)" stroke="#ffffff" stroke-width="2.5" />
    <rect x="319" y="240" width="36" height="120" fill="url(#crystalGrad)" stroke="#ffffff" stroke-width="2.5" rx="4" />

    <!-- Castle Walls & Foundation -->
    <path d="M120,340 L392,340 L380,410 L132,410 Z" fill="#0284c7" opacity="0.6" />
    <rect x="135" y="320" width="242" height="70" fill="url(#crystalGrad)" rx="8" stroke="#ffffff" stroke-width="3" />

    <!-- Castle Arch Gate -->
    <path d="M226,390 C226,345 286,345 286,390 Z" fill="#0369a1" />
  </g>

  <!-- Large Central Ice Snowflake & Magic Wand Crown -->
  <g filter="url(#glow)">
    <!-- Snowflake Spokes -->
    <path d="M256,160 L256,360 M156,260 L356,260 M185,189 L327,331 M185,331 L327,189" 
          stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
    
    <!-- Snowflake Crystal Diamonds -->
    <polygon points="256,145 264,160 256,175 248,160" fill="#ffffff" />
    <polygon points="256,345 264,360 256,375 248,360" fill="#ffffff" />
    <polygon points="145,260 160,268 175,260 160,252" fill="#ffffff" />
    <polygon points="345,260 360,268 375,260 360,252" fill="#ffffff" />

    <!-- Center Magic Diamond -->
    <polygon points="256,230 286,260 256,290 226,260" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4" />
  </g>

  <!-- Floating Math Magic Symbols & Blocks -->
  <!-- Top-Right Math Block "+ 10" -->
  <g filter="url(#softShadow)" transform="translate(330, 80) rotate(12)">
    <rect width="96" height="60" rx="16" fill="#f59e0b" stroke="#ffffff" stroke-width="3" />
    <text x="48" y="42" fill="#ffffff" font-size="34" font-weight="900" font-family="Arial, sans-serif" text-anchor="middle">+10</text>
  </g>

  <!-- Top-Left Math Block "1+2" -->
  <g filter="url(#softShadow)" transform="translate(75, 95) rotate(-14)">
    <rect width="84" height="56" rx="16" fill="#10b981" stroke="#ffffff" stroke-width="3" />
    <text x="42" y="39" fill="#ffffff" font-size="28" font-weight="900" font-family="Arial, sans-serif" text-anchor="middle">123</text>
  </g>

  <!-- Golden Magic Stars -->
  <polygon points="256,38 263,56 281,56 267,67 272,85 256,74 240,85 245,67 231,56 249,56" fill="url(#goldGrad)" />
  <polygon points="110,230 114,240 125,240 116,247 119,258 110,251 101,258 104,247 95,240 106,240" fill="url(#goldGrad)" />
  <polygon points="405,240 409,250 420,250 411,257 414,268 405,261 396,268 399,257 390,250 401,250" fill="url(#goldGrad)" />

  <!-- Bottom App Banner / Badge: 冰雪數學 -->
  <g filter="url(#softShadow)">
    <rect x="76" y="425" width="360" height="62" rx="31" fill="#ffffff" />
    <text x="256" y="468" fill="#0369a1" font-size="30" font-weight="900" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" letter-spacing="3">
      ❄️ 冰雪魔法數學
    </text>
  </g>
</svg>
